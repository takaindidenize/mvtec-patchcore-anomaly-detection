name: CI

# The dataset is never committed, so CI can only run linting and unit tests.
# Training, evaluation and benchmarking are local / container tasks.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Test
        run: python -m pytest
